{% if cover_url %}<img class="cover-image" src="{{ cover_url }}" alt="{{ artwork_title }} cover artwork" width="600" height="600" loading="lazy" referrerpolicy="no-referrer">{% else %}<div class="cover-placeholder" role="img" aria-label="No cover artwork for {{ artwork_title }}"><span class="placeholder-orbit"></span><span class="placeholder-initial">{{ artwork_title|slice:':1'|upper }}</span><span class="placeholder-caption">ARTWORK NOT ADDED</span></div>{% endif %}
