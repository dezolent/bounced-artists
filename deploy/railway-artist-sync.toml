# Reference settings for the separate artist-sync cron service.
# Live settings are applied directly; Railway rejected the deprecated config path.
# The web service continues to use its existing configuration.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh scripts/sync_artist_platforms.sh"
cronSchedule = "0 9 * * *"
restartPolicyType = "NEVER"
numReplicas = 1
